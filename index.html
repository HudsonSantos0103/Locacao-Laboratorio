<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Alocação de Laboratório</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

<style>
:root {
    --primary: #0f172a;
    --secondary: #1e293b;
    --accent: #3b82f6;
    --light: #f1f5f9;
    --white: #ffffff;
    --transition: 0.3s ease;
}

* { margin:0; padding:0; box-sizing:border-box; font-family: Inter, sans-serif; }

body { background: var(--light); }

/* LOGIN */
#auth-screen {
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b);
}

.login-box {
    background: var(--white);
    padding:40px;
    border-radius:16px;
    width:320px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.login-box input {
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

.login-box button {
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:white;
    cursor:pointer;
}

/* APP */
#app { display:none; padding:20px; }

.lab-buttons {
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.lab-buttons button {
    padding:10px 20px;
    border:none;
    border-radius:30px;
    background:var(--primary);
    color:white;
    cursor:pointer;
    transition:var(--transition);
}

.lab-buttons button.active {
    background:var(--accent);
}

.view-toggle {
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.view-toggle button {
    padding:8px 16px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:var(--primary);
    color:white;
}

.view-toggle button.active {
    background:var(--accent);
}

.table-container {
    background:white;
    padding:20px;
    border-radius:12px;
    animation:fadeSlide 0.3s ease;
}

table {
    width:100%;
    border-collapse:collapse;
}

th, td {
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th { background:var(--primary); color:white; }

@keyframes fadeSlide {
    from { opacity:0; transform:translateY(10px); }
    to { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="auth-screen">
    <div class="login-box">
        <h2>Login</h2>
        <input type="text" id="user" placeholder="Usuário">
        <input type="password" id="pass" placeholder="Senha">
        <button onclick="login()">Entrar</button>
    </div>
</div>

<!-- SISTEMA -->
<div id="app">

    <h1>Alocação de Laboratórios</h1>

    <div class="lab-buttons">
        <button onclick="changeLab('Lab 1', this)" class="active">Lab 1</button>
        <button onclick="changeLab('Lab 2', this)">Lab 2</button>
        <button onclick="changeLab('Lab 3', this)">Lab 3</button>
    </div>

    <div class="view-toggle">
        <button class="active" onclick="switchView('tabela', this)">Tabela</button>
        <button onclick="switchView('calendario', this)">Calendário</button>
    </div>

    <div class="table-container" id="tableView">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Professor</th>
                    <th>Turma</th>
                </tr>
            </thead>
            <tbody id="reservasTable"></tbody>
        </table>
    </div>

    <div id="calendarContainer" style="display:none; background:white; padding:20px; border-radius:12px;"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
let currentLab = "Lab 1";
let calendar;
let reservas = JSON.parse(localStorage.getItem("reservas")) || [];

function login() {
    document.getElementById("auth-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    renderTable();
}

function changeLab(lab, btn) {
    currentLab = lab;
    document.querySelectorAll(".lab-buttons button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    document.getElementById("tableView").classList.remove("table-container");
    void document.getElementById("tableView").offsetWidth;
    document.getElementById("tableView").classList.add("table-container");

    renderTable();
    if (calendar) calendar.refetchEvents();
}

function switchView(view, btn) {
    document.querySelectorAll(".view-toggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    if (view === "tabela") {
        document.getElementById("tableView").style.display = "block";
        document.getElementById("calendarContainer").style.display = "none";
    } else {
        document.getElementById("tableView").style.display = "none";
        document.getElementById("calendarContainer").style.display = "block";
        initCalendar();
    }
}

function renderTable() {
    const tbody = document.getElementById("reservasTable");
    tbody.innerHTML = "";

    reservas
        .filter(r => r.lab === currentLab)
        .forEach(r => {
            tbody.innerHTML += `
                <tr>
                    <td>${r.data}</td>
                    <td>${r.professor}</td>
                    <td>${r.turma}</td>
                </tr>
            `;
        });
}

function initCalendar() {
    if (calendar) return;

    const container = document.getElementById("calendarContainer");

    calendar = new FullCalendar.Calendar(container, {
        initialView: 'dayGridMonth',
        locale: 'pt-br',
        height: 600,
        events: function(fetchInfo, successCallback) {
            const eventos = reservas
                .filter(r => r.lab === currentLab)
                .map(r => ({
                    title: `${r.professor} (${r.turma})`,
                    start: r.data
                }));
            successCallback(eventos);
        },
        dateClick: function(info) {
            const professor = prompt("Professor:");
            const turma = prompt("Turma:");

            if (!professor || !turma) return;

            const nova = {
                lab: currentLab,
                data: info.dateStr,
                professor,
                turma
            };

            reservas.push(nova);
            localStorage.setItem("reservas", JSON.stringify(reservas));

            renderTable();
            calendar.refetchEvents();
        }
    });

    calendar.render();
}
</script>

</body>
</html>
